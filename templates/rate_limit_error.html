{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm p-4 text-center">
            <i class="fas fa-clock fa-3x text-warning mb-3"></i>
            <h2 class="fw-bold">Too many requests</h2>
            <p class="text-muted mb-4">Please wait briefly and try again. Your access has not been permanently blocked.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">Return safely</a>
        </div>
    </div>
</div>
{% endblock %}
