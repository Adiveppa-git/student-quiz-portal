{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm p-4 text-center">
            <i class="fas fa-shield-alt fa-3x text-danger mb-3"></i>
            <h2 class="fw-bold">Security validation failed</h2>
            <p class="text-muted mb-4">Your form security token is missing or has expired. Please refresh the page and try again.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">Return safely</a>
        </div>
    </div>
</div>
{% endblock %}
